[project]
name = "co2ie"
version = "0.1.0"
description = "CO2 host interaction-energy dataset (SMILES → conformers → xTB → Psi4 r²SCAN-3c)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "rdkit",
    "numpy>=1.21,<2",
    "pandas>=1.3",
    "pyyaml>=6",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
    "xgboost>=3.2.0",
    "scipy>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["co2ie"]
