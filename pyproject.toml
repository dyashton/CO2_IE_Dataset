[project]
name = "co2ie"
version = "0.1.0"
description = "CO2 host interaction-energy dataset (SMILES → conformers → xTB → Psi4 r²SCAN-3c)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "rdkit",
    "numpy>=1.21,<2",
    "pandas>=1.3",
    "pyyaml>=6",
    "scikit-learn>=1.6.1",
    "joblib>=1.6.0",
    "xgboost>=3.2.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
# Extra stacks not required for discovery AL / DFT / binding-pack retrain.
ml = [
    "transformers>=5.17.0",
    "torch>=2.14.0",
    "ase>=3.29.0",
    "mace-torch>=0.3.17",
    "graph-longrange @ git+https://github.com/WillBaldwin0/graph_electrostatics.git@v0.4.4",
    "mordred>=1.2.0",
]
llm = [
    "openai>=3.13.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["co2ie"]
